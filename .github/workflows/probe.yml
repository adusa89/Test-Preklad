name: Zkouška služeb pro přihlášení
on:
  push:
    paths: [.github/workflows/probe.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for a in geckoview geckoview-x86 geckoview-x86_64 geckoview-arm64-v8a geckoview-armeabi-v7a; do
            echo "== $a"; curl -sS -m 20 "https://maven.mozilla.org/maven2/org/mozilla/geckoview/$a/maven-metadata.xml" | grep -E "<latest>|<release>|<lastUpdated>" ; curl -sS -m 20 "https://maven.mozilla.org/maven2/org/mozilla/geckoview/$a/maven-metadata.xml" | grep -oE "<version>[^<]+" | tail -3
          done
          V=$(curl -sS -m 20 "https://maven.mozilla.org/maven2/org/mozilla/geckoview/geckoview/maven-metadata.xml" | grep -oE "<release>[^<]+" | cut -d'>' -f2)
          echo "== release $V"
          curl -sS -m 30 "https://maven.mozilla.org/maven2/org/mozilla/geckoview/geckoview/$V/geckoview-$V.pom" | head -60
          curl -sS -m 60 -o g.aar "https://maven.mozilla.org/maven2/org/mozilla/geckoview/geckoview/$V/geckoview-$V.aar"; ls -la g.aar; unzip -l g.aar | grep -E "\.so$|AndroidManifest|omni" | head -30
          unzip -p g.aar AndroidManifest.xml | grep -E "minSdk|uses-sdk|uses-permission|<service|<provider|<activity" | head -40
