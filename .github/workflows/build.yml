name: Sestavit APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Testy logiky
        run: chmod +x gradlew && ./gradlew testDebugUnitTest --no-daemon

      - name: Sestavení APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Přejmenovat APK
        run: cp app/build/outputs/apk/release/app-release.apk TestPreklad.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TestPreklad-APK
          path: TestPreklad.apk

      - name: Vydat APK ke stažení
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          unzip -l TestPreklad.apk | grep -E "classes.*dex|\.so$" | head -20
          ls -la TestPreklad.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest TestPreklad.apk --title "Test Překlad – nejnovější APK" --notes "Automaticky sestaveno z posledního kódu."
