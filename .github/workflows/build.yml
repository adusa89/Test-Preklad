name: Sestavit APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Testy logiky
        run: chmod +x gradlew && ./gradlew testDebugUnitTest --no-daemon

      - name: Sestavení APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Přejmenovat APK
        run: cp app/build/outputs/apk/release/app-release.apk TestPreklad.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TestPreklad-APK
          path: TestPreklad.apk

      - name: Vydat APK ke stažení
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          unzip -l TestPreklad.apk | grep -E "classes.*dex|\.so$" | head -20
          ls -la TestPreklad.apk
          CODE=$(grep -oE 'versionCode = [0-9]+' app/build.gradle.kts | grep -oE '[0-9]+')
          NAME=$(grep -oE 'versionName = "[^"]+"' app/build.gradle.kts | cut -d'"' -f2)
          echo "$CODE $NAME" > version.txt
          cat version.txt
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest TestPreklad.apk version.txt --title "Test Překlad – nejnovější APK" --notes "Automaticky sestaveno z posledního kódu."

  emulator:
    name: Emulátor Android TV (API ${{ matrix.api }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api: [28, 30, 33, 34]   # Android 9, 11, 13, 14
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Sestavení zkušební verze
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: Povolit KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Zkouška v emulátoru
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: android-tv
          arch: x86
          profile: tv_1080p
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -memory 2048
          script: bash ci/emulator-test.sh

      - name: Uložit výsledky
        if: always()
        run: |
          cd test-results || exit 0
          git init -q -b test-results-api${{ matrix.api }}
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -q -m "Výsledky zkoušky v emulátoru"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" test-results-api${{ matrix.api }}
