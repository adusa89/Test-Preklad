name: Sestavit APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Testy logiky
        run: chmod +x gradlew && ./gradlew testDebugUnitTest --no-daemon

      - name: Sestavení APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Přejmenovat APK
        run: cp app/build/outputs/apk/release/app-release.apk TestPreklad.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TestPreklad-APK
          path: TestPreklad.apk
