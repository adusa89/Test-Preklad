name: PS5 klient (zkouška spojení)

# Sestaví nezměněný otevřený Remote Play klient chiaki-ng (AGPL-3.0)
# z pevně daného commitu. Slouží jen k ověření, že se televize spojí s PS5.
# Zdrojový kód: https://github.com/streetpea/chiaki-ng

on:
  push:
    paths:
      - .github/workflows/ps5-test.yml
  workflow_dispatch:

permissions:
  contents: write

env:
  CHIAKI_COMMIT: 43728af2e639fecb8a7af1cd68c29820a40de973

jobs:
  chiaki:
    runs-on: ubuntu-latest
    steps:
      - name: Stáhnout chiaki-ng
        run: |
          git clone https://github.com/streetpea/chiaki-ng
          cd chiaki-ng
          git checkout "$CHIAKI_COMMIT"
          git submodule update --init --recursive --depth 1

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Nástroje pro sestavení
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq protobuf-compiler python3-protobuf ninja-build
          pip3 install --user --break-system-packages protobuf grpcio-tools || true
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "ndk;28.2.13676358" "cmake;3.22.1" "platforms;android-35" "build-tools;35.0.0" | tail -3

      - name: Sestavit APK
        working-directory: chiaki-ng/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -Pandroid.injected.build.abi=arm64-v8a,armeabi-v7a 2>&1 | tail -150

      - name: Najít APK
        run: |
          find chiaki-ng/android -name "*.apk" -exec ls -la {} \;
          cp "$(find chiaki-ng/android -name '*debug*.apk' | head -1)" PS5-Test.apk
          unzip -l PS5-Test.apk | grep "\.so$"

      - uses: actions/upload-artifact@v4
        with:
          name: PS5-Test-APK
          path: PS5-Test.apk

      - name: Vydat ke stažení
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete ps5-test --yes --cleanup-tag || true
          gh release create ps5-test PS5-Test.apk --prerelease --target "${{ github.sha }}" \
            --title "PS5 klient – zkouška spojení" \
            --notes "Nezměněný otevřený klient chiaki-ng (licence AGPL-3.0), commit $CHIAKI_COMMIT. Zdroj: https://github.com/streetpea/chiaki-ng"
